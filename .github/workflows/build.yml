name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["tests.yml"]
    types:
      - completed
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build iOS IPA
        env:
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liner-ios-ipa
          path: |
            *.ipa
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build Android APK
        env:
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liner-android-apk
          path: |
            *.apk
          if-no-files-found: warn
